name: insightmesh

x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
    target: development
  environment: &backend-env
    APP_ENV: development
    CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?Set CREDENTIAL_ENCRYPTION_KEY in .env}
    PGHOST: metadata-db
    PGPORT: "5432"
    PGDATABASE: insightmesh
    PGUSER: insightmesh
    PGPASSWORD: ${METADATA_PASSWORD:-local-metadata-only}
    OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
    OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com}
    GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
    LLM_MODEL: ${LLM_MODEL:-gemini-2.5-flash}
    LLM_FALLBACK_PROVIDER: ${LLM_FALLBACK_PROVIDER:-openrouter}
    LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-openai/gpt-4o-mini}
    EMBEDDING_MODEL: ${EMBEDDING_MODEL:-openai/text-embedding-3-large}
    EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
    MODEL_CONFIG_VERSION: ${MODEL_CONFIG_VERSION:-v1}
    RETRIEVAL_TOP_K: ${RETRIEVAL_TOP_K:-4}
    RETRIEVAL_STRATEGY: ${RETRIEVAL_STRATEGY:-hybrid}
    RETRIEVAL_SEMANTIC_WEIGHT: ${RETRIEVAL_SEMANTIC_WEIGHT:-0.65}
    RETRIEVAL_LEXICAL_WEIGHT: ${RETRIEVAL_LEXICAL_WEIGHT:-0.35}
    RETRIEVAL_HYBRID_RELATIVE_THRESHOLD: ${RETRIEVAL_HYBRID_RELATIVE_THRESHOLD:-0.64}
    RETRIEVAL_CONFIG_VERSION: ${RETRIEVAL_CONFIG_VERSION:-v2-hybrid}
    RETRIEVAL_MAX_ENTITIES: ${RETRIEVAL_MAX_ENTITIES:-8}
    RETRIEVAL_MAX_FIELDS_PER_ENTITY: ${RETRIEVAL_MAX_FIELDS_PER_ENTITY:-24}
    RETRIEVAL_MAX_RELATIONSHIP_HOPS: ${RETRIEVAL_MAX_RELATIONSHIP_HOPS:-3}
    RELATIONSHIP_INFERRED_MIN_CONFIDENCE: ${RELATIONSHIP_INFERRED_MIN_CONFIDENCE:-0.8}
    QUERY_MAX_REPAIR_ATTEMPTS: ${QUERY_MAX_REPAIR_ATTEMPTS:-2}
    QUERY_RUN_ARTIFACT_RETENTION_DAYS: ${QUERY_RUN_ARTIFACT_RETENTION_DAYS:-7}
    QUERY_RUN_RETENTION_DAYS: ${QUERY_RUN_RETENTION_DAYS:-90}
  networks: [app, data]

services:
  metadata-db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: insightmesh
      POSTGRES_USER: insightmesh
      POSTGRES_PASSWORD: ${METADATA_PASSWORD:-local-metadata-only}
    volumes:
      - metadata-data:/var/lib/postgresql/data
      - ./docker/metadata/001-vector.sql:/docker-entrypoint-initdb.d/001-vector.sql:ro
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  demo-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: insightmesh_demo
      POSTGRES_USER: demo_admin
      POSTGRES_PASSWORD: ${DEMO_ADMIN_PASSWORD:-local-demo-admin-only}
      DEMO_READER_PASSWORD: ${DEMO_READER_PASSWORD:-local-demo-reader-only}
    volumes:
      - demo-data:/var/lib/postgresql/data
      - ./demo/postgres/init.sh:/docker-entrypoint-initdb.d/001-demo.sh:ro
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  demo-mysql:
    image: mysql:8.4
    profiles: [mysql]
    environment:
      MYSQL_DATABASE: insightmesh_demo
      MYSQL_ROOT_PASSWORD: ${DEMO_MYSQL_ADMIN_PASSWORD:-local-mysql-admin-only}
      DEMO_READER_PASSWORD: ${DEMO_READER_PASSWORD:-local-demo-reader-only}
    volumes:
      - demo-mysql-data:/var/lib/mysql
      - ./demo/mysql/init.sh:/docker-entrypoint-initdb.d/001-demo.sh:ro
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  migrate:
    <<: *backend
    command: [uv, run, --frozen, alembic, upgrade, head]
    depends_on:
      metadata-db:
        condition: service_healthy
    restart: "no"

  backend:
    <<: *backend
    environment:
      <<: *backend-env
      DEMO_READER_PASSWORD: ${DEMO_READER_PASSWORD:-local-demo-reader-only}
    ports: ["127.0.0.1:${BACKEND_PORT:-8000}:8000"]
    volumes:
      - ./backend/api:/app/api
      - ./backend/connectors:/app/connectors
      - ./backend/persistence:/app/persistence
      - ./backend/services:/app/services
      - ./backend/semantic:/app/semantic
      - ./backend/harness:/app/harness
      - ./backend/query:/app/query
      - ./backend/skills:/app/skills
      - ./backend/visualization:/app/visualization
      - ./evals:/app/evals:ro
      - ./evals/reports:/app/evals/reports
      - ./tests:/app/tests:ro
    depends_on:
      metadata-db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: development
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
      NEXT_TELEMETRY_DISABLED: "1"
    ports: ["127.0.0.1:${FRONTEND_PORT:-3000}:3000"]
    volumes:
      - ./frontend/app:/app/app
      - ./frontend/components:/app/components
      - ./frontend/lib:/app/lib
      - ./frontend/tests:/app/tests:ro
    networks: [app]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok) process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  e2e:
    image: mcr.microsoft.com/playwright:v1.55.1-noble
    profiles: [test]
    working_dir: /app
    environment:
      PLAYWRIGHT_BASE_URL: http://frontend:3000
      DEMO_READER_PASSWORD: ${DEMO_READER_PASSWORD:-local-demo-reader-only}
    command: [bash, -lc, "npm ci --ignore-scripts && npm run test:e2e"]
    volumes:
      - ./frontend:/app
      - e2e-node-modules:/app/node_modules
    networks: [app]
    depends_on:
      frontend:
        condition: service_healthy

networks:
  app:
  data:
    internal: true

volumes:
  metadata-data:
  demo-data:
  demo-mysql-data:
  e2e-node-modules:
